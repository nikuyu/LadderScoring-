<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Paddle Slayer Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:#f1f5f9;}
.league-bar{display:flex;background:#7f1d1d;}
.lbtn{flex:1;padding:13px 8px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:transparent;color:#555;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:7px;}
.lbtn img{height:20px;object-fit:contain;}
.lbtn.ma{background:rgba(220,80,30,0.15);color:#ff6b35;border-bottom-color:#ff6b35;}
.lbtn.wa{background:rgba(147,102,200,0.15);color:#c084fc;border-bottom-color:#c084fc;}
.hdr{padding:16px 16px 0;}.hdr-in{max-width:760px;margin:0 auto;}
.hdr-title{font-size:21px;font-weight:800;letter-spacing:-0.5px;color:#fff;display:flex;align-items:center;}
.hdr-title-logo{height:26px;width:26px;object-fit:contain;border-radius:6px;flex-shrink:0;margin-right:8px;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.65);margin-top:3px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.btn-exp{border:none;border-radius:8px;padding:8px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:#f59e0b;color:#fff;}
.btn-admin{border:none;border-radius:8px;padding:8px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);}
.ntabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;}
.ntab{padding:9px 14px;border:none;background:transparent;font-weight:700;font-size:11px;border-radius:8px 8px 0 0;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;color:rgba(255,255,255,0.55);}
.ntab.active{background:#fff;}
.rpill{margin-left:auto;align-self:center;padding-bottom:6px;}
.rpill span{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.15);color:#fff;}
.admin-badge{background:#f59e0b;color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px;}
.main{max-width:760px;margin:0 auto;padding:16px;}
.pg{display:none;}.pg.active{display:block;}
/* Login modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:16px;padding:28px;width:300px;max-width:90vw;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#6b7280;margin-bottom:18px;}
.modal input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;}
.modal input:focus{border-color:#7c3aed;}
.modal-btns{display:flex;gap:8px;}
.modal-err{color:#ef4444;font-size:11px;margin-bottom:8px;display:none;}
/* Attendance */
.wbtns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.wbtn{padding:7px 15px;border-radius:20px;border:2px solid #e5e7eb;background:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}
.search{width:100%;padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit;outline:none;margin-bottom:10px;border:1px solid #d1d5db;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;}
.ptile{border-radius:10px;border:2px solid #e5e7eb;padding:9px 8px;display:flex;align-items:center;gap:8px;background:#fff;transition:all 0.15s;}
.ptile.clickable{cursor:pointer;}
.ptile.sm{border-color:#ff6b35;background:#fff5f0;}
.ptile.sw{border-color:#9333ea;background:#faf5ff;}
.pav{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex-shrink:0;border:2px solid #e5e7eb;}
.pav.sm-av{border-color:#ff6b35;}
.pav.sw-av{border-color:#9333ea;}
.pav-init{width:38px;height:38px;border-radius:50%;background:#c7d2fe;flex-shrink:0;font-size:14px;font-weight:800;color:#3730a3;display:flex;align-items:center;justify-content:center;border:2px solid #e5e7eb;}
.pnm{font-size:11px;font-weight:600;color:#111;line-height:1.3;word-break:break-word;}
.btn-cf{width:100%;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:14px;color:#fff;}
/* Scoresheet */
.cpills{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap;}
.cpill{padding:7px 16px;border-radius:20px;border:2px solid #e5e7eb;background:#fff;color:#374151;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
.cc{border-radius:10px;padding:1px 6px;font-size:10px;}
.ccard{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.chdr{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;}
.chl{display:flex;align-items:center;gap:9px;}
.cnum{background:#f59e0b;color:#fff;font-weight:700;font-size:17px;width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cnm{color:#fff;font-weight:600;font-size:15px;}
.sbg{background:rgba(255,255,255,.2);color:#fff;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;}
.rbg{background:rgba(255,255,255,.15);color:#e2e8f0;padding:3px 9px;border-radius:20px;font-size:11px;}
.rch{display:grid;grid-template-columns:32px 1fr 1fr 34px 34px 1fr 1fr;gap:4px;padding:8px 13px 5px;background:#f9fafb;border-bottom:1px solid #e5e7eb;}
.rch div{font-size:10px;font-weight:700;text-align:center;}
.rbdy{padding:6px 13px 14px;}
.rrow{display:grid;grid-template-columns:32px 1fr 1fr 34px 34px 1fr 1fr;gap:4px;align-items:center;padding:4px 2px;border-bottom:1px solid #f3f4f6;margin-bottom:1px;border-radius:4px;}
.rrow.hd{background:rgba(239,246,255,.6);}.rrow:last-child{border-bottom:none;}
.rl{font-size:10px;font-weight:600;color:#9ca3af;padding-left:2px;}.rl.act{color:#1e40af;}
/* Guest view - player name display in scoresheet */
.pname-cell{font-size:11px;font-weight:600;color:#1e40af;text-align:center;padding:4px 2px;display:flex;align-items:center;justify-content:center;gap:4px;}
.pname-cell img{width:20px;height:20px;border-radius:50%;object-fit:cover;}
.pname-cell .ini{width:20px;height:20px;border-radius:50%;background:#c7d2fe;font-size:8px;font-weight:800;color:#3730a3;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.empty-cell{font-size:11px;color:#d1d5db;text-align:center;}
select{width:100%;padding:5px 3px;font-size:12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#9ca3af;cursor:pointer;outline:none;font-family:inherit;}
select.fl{background:#eff6ff;color:#1e40af;}input.snum{width:100%;padding:5px 3px;font-size:12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#111;text-align:center;outline:none;font-family:inherit;}input.snum.fl{background:#eff6ff;color:#1e40af;border-color:#1e40af;}input.snum.mm{border-color:#dc2626;background:#fef2f2;}
.g1{background:linear-gradient(135deg,#7c3aed,#5b21b6);}.g3{background:linear-gradient(135deg,#1d4ed8,#1e3a8a);}
.g5{background:linear-gradient(135deg,#0369a1,#075985);}.g7{background:linear-gradient(135deg,#0f766e,#115e59);}
/* Standings */
.stog{display:flex;gap:6px;margin-bottom:13px;}
.stab{padding:8px 18px;border-radius:20px;border:2px solid #e5e7eb;background:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}
.scard{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.shdr{padding:13px 18px;color:#fff;font-weight:700;font-size:15px;}
.sbdy{padding:14px;}
.sleg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.schip{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:4px 9px;font-size:10px;color:#0369a1;font-weight:600;}
.xtw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:#7f1d1d;color:#fff;}
th{padding:9px 10px;text-align:left;font-size:11px;}
th.c,td.c{text-align:center;}
td{padding:8px 10px;border-top:1px solid #f3f4f6;}
tbody tr:nth-child(odd){background:#f9fafb;}
.pb{background:#7f1d1d;color:#fff;border-radius:12px;padding:2px 9px;font-weight:700;font-size:12px;}
.wn{color:#16a34a;font-weight:700;}.ln{color:#dc2626;font-weight:700;}.gn{color:#6b7280;}
.plrow td{vertical-align:middle;}
.pl-av-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;}
.pl-ini-sm{width:28px;height:28px;border-radius:50%;background:#c7d2fe;font-size:10px;font-weight:800;color:#3730a3;display:inline-flex;align-items:center;justify-content:center;}
.empty{text-align:center;color:#9ca3af;padding:36px 0;font-size:13px;}
.no-at{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px;}
/* Players admin */
.aform{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:17px;margin-bottom:14px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fl2{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;}
input[type=text],input[type=password]{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;font-family:inherit;outline:none;width:100%;}
.btn{border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;}
.btn-sm{padding:5px 11px;font-size:11px;}.btn-r{background:#ef4444;color:#fff;}.btn-g{background:#e5e7eb;color:#374151;}
.av-p{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e5e7eb;}
.acnt-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.acnt{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;}
.readonly-note{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:12px;font-weight:600;}
/* Theme */
.tm .ntab.active{color:#1a1a1a;}
.tm .wbtn.active,.tm .cpill.active,.tm .stab.active{border-color:#1a1a1a;background:#1a1a1a;color:#fff;}
.tw2 .ntab.active{color:#7e22ce;}
.tw2 .wbtn.active,.tw2 .cpill.active,.tw2 .stab.active{border-color:#7e22ce;background:#7e22ce;color:#fff;}
.hm{background:linear-gradient(135deg,#111,#2d2d2d);}
.hw{background:linear-gradient(135deg,#581c87,#9333ea);}
@media(max-width:480px){
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  .fgrid{grid-template-columns:1fr;}
  .rch,.rrow{grid-template-columns:36px 1fr 1fr 1fr 1fr;}
}</style>
</head>

function mkR(){var r={};CO.forEach(function(c){r[c]=[];for(var i=0;i<MR;i++)r[c].push({a1:"",a2:"",b1:"",b2:"",sa:"",sb:""});});return r;}
var S={at:[],rds:mkR(),pl:null};

function gpl(){if(!S.pl)S.pl=JSON.parse(JSON.stringify(MASTER));return S.pl;}
function gat(){return S.at;}
function grd(){return S.rds;}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function av(id){return id?"https://assets.reclub.co/user-avatars/"+id+".webp":"";}
function acc(){return "#1a1a1a";}
function rowResult(r){
  if(!r.a1||!r.a2||!r.b1||!r.b2)return null;
  var sa=parseInt(r.sa,10),sb=parseInt(r.sb,10);
  if(isNaN(sa)||isNaN(sb)||sa===sb)return null;
  return sa>sb?{win:[r.a1,r.a2],lose:[r.b1,r.b2]}:{win:[r.b1,r.b2],lose:[r.a1,r.a2]};
}
function tf(){return CO.reduce(function(s,c){return s+grd()[c].filter(function(r){return rowResult(r);}).length;},0);}

// ── Server sync ───────────────────────────────────────────────
function toSave(){
  return { pl:gpl(), at:S.at, rds:S.rds, gameCap:gameCap };
}
function applyData(d){
  if(!d||!d.rds)return;
  if(d.at)S.at=d.at;
  if(d.rds)S.rds=d.rds;
  if(d.pl&&d.pl.length)S.pl=d.pl;
  if(d.gameCap!==undefined)gameCap=d.gameCap;
}
async function save(){
  try{
    saving=true;
    await fetch("/api/s5scoresheet",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(toSave())
    });
    saving=false;
    var ind=document.getElementById("sync-ind");
    if(ind){ind.textContent="Saved ✓";ind.style.color="#16a34a";setTimeout(function(){if(ind)ind.textContent="";},2000);}
  }catch(ex){saving=false;console.warn("Save failed:",ex);}
}
window.lastLoadDebug={};
async function load(){
  var retries=3;
  while(retries-->0){
    try{
      loading=true;
      var res=await fetch("/api/s5scoresheet");
      var d=await res.json();
      window.lastLoadDebug={
        status:res.status,
        hasRds:!!(d&&d.rds),
        atLen:d&&d.at?d.at.length:0,
        rdsKeys:d&&d.rds?Object.keys(d.rds):[],
        rawKeys:d?Object.keys(d):[],
        retries:retries
      };
      if(d&&d.rds){
        applyData(d);
        loading=false;
        render();
        return;
      }
      // Server returned empty - wait and retry
      await new Promise(function(r){setTimeout(r,1500);});
    }catch(ex){
      window.lastLoadDebug={error:ex.message,retry:retries};
      console.warn("Load failed, retrying:",ex);
      await new Promise(function(r){setTimeout(r,1500);});
    }
  }
  // All retries failed - use seed but DO NOT save to server
  window.lastLoadDebug.usedSeed=true;
  applyData(SEED);
  loading=false;
  render();
}

function render(){
  if(loading){document.getElementById("app").innerHTML="<div style=\"text-align:center;padding:60px 20px;color:#9ca3af;\">&#128260; Loading...</div>";return;}
  document.getElementById("app").innerHTML=buildApp();
}
function rp(p){
  var el=document.getElementById("pg-"+p);
  if(!el)return;
  if(p==="attend")el.innerHTML=bAt();
  else if(p==="score")el.innerHTML=bSc();
  else if(p==="standings")el.innerHTML=bSt();
  else if(p==="players")el.innerHTML=bPl();
  var pill=document.querySelector(".rpill span");
  if(pill)pill.textContent=tf()+" results";
}

  if(isAdmin){h.push("<button class=\"btn-exp\" onclick=\"expCSV()\">&#128203; CSV</button>");h.push("<button class=\"btn-exp\" style=\"background:#3b82f6;margin-left:5px;\" onclick=\"expJSON()\">&#128190; JSON</button>");}
  h.push(adminBtn+debugBtn+"</div></div>");

  h.push("</div></div><div class=\"main\">");
  if(isAdmin)h.push("<div id=\"pg-attend\" class=\"pg"+(tab==="attend"?" active":"")+"\">"+bAt()+"</div>");

    +"<div class=\"modal-sub\">Masukkan password untuk edit mode</div>"
    +"<div class=\"modal-err\" id=\"merr\">Password salah!</div>"
    +"<input type=\"password\" id=\"mpw\" placeholder=\"Password\" onkeydown=\"if(event.key==='Enter')doLogin()\">"
    +"<div class=\"modal-btns\">"
    +"<button class=\"btn\" style=\"background:#7f1d1d;color:#fff;flex:1;\" onclick=\"doLogin()\">Login</button>"
    +"<button class=\"btn btn-g\" onclick=\"closeLogin()\">Cancel</button>"
    +"</div></div></div>";
}

function bAt(){
  var pl=gpl(),at=gat();
  var fil=pl.filter(function(p){return p.name.toLowerCase().indexOf(sq.toLowerCase())>-1||(p.handle||"").toLowerCase().indexOf(sq.toLowerCase())>-1;});
  var tiles=fil.map(function(p){
    var sel=at.indexOf(p.handle)>-1;
    var sc=sel?"sm":"";
    var brd=sel?"border-color:#ff6b35;":"";
    return ["<div class=\"ptile clickable ",sc,"\" onclick=\"tAt('",e(p.handle),"')\" style=\"",brd,"\">"
      ,"<div style=\"display:flex;align-items:center;gap:8px;\">",avImg(p.avatarId,p.name,"lg")
      ,"<div class=\"pnm\">",e(p.name),"</div></div></div>"].join("");
  }).join("");
  var h=[];
  h.push("<div class=\"acnt-row\"><div style=\"font-size:14px;font-weight:700;\">Siapa Hadir?</div>");
  h.push("<div class=\"acnt\" style=\"background:#fff5f0;color:"+acc()+";border:1px solid "+acc()+"30;\">"+at.length+" / "+pl.length+"</div></div>");
  h.push("<input class=\"search\" type=\"text\" placeholder=\"Cari nama...\" value=\""+e(sq)+"\" oninput=\"sq=this.value;rp('attend')\">");
  h.push("<div style=\"display:flex;gap:7px;margin-bottom:12px;\">");
  h.push("<button class=\"btn btn-sm\" style=\"background:"+acc()+";color:#fff;\" onclick=\"selAll()\">Select All</button>");
  h.push("<button class=\"btn btn-g btn-sm\" onclick=\"clrAt()\">Clear</button></div>");
  h.push("<div class=\"pgrid\">"+tiles+"</div>");
  h.push("<button class=\"btn-cf\" style=\"background:"+acc()+"\" onclick=\"sTab('score')\">&#9989; Confirm "+at.length+" Players &rarr; Scoresheet</button>");
  return h.join("");
}

function bSc(){
  var at=gat(),pl=gpl();
  var pills=CO.map(function(c){
    var f=grd()[c].filter(function(r){return rowResult(r);}).length;
    var isA=c===ac;
    return ["<button class=\"cpill",isA?" active":"","\" onclick=\"sAC(",c,")\">"
      ,"Court ",CN[c],f>0?["<span class=\"cc\" style=\"background:",isA?"rgba(255,255,255,.3)":"#ede9fe",";color:",isA?"#fff":"#5b21b6","\">",f,"</span>"].join(""):""
      ,"</button>"].join("");
  }).join("");
  return "<div class=\"cpills\">"+pills+"</div>"+bCC();
}

function bCC(){
  var c=ac,rds=grd()[c];
  var f=rds.filter(function(r){return rowResult(r);}).length;
  var W=WP+CB[c],L=CB[c];
  var at=gat(),pl=gpl();
  var pres=pl.filter(function(p){return at.indexOf(p.handle)>-1;});
  var rows=[];
  for(var i=0;i<MR;i++){
    var r=rds[i],hd=!!(r.a1||r.a2||r.b1||r.b2||r.sa||r.sb);
    if(!isAdmin&&!hd)continue;
    var res=rowResult(r);
    var mm=r.sa!==""&&r.sb!==""&&r.sa!==undefined&&r.sb!==undefined&&parseInt(r.sa,10)===parseInt(r.sb,10);
    var row=["<div class=\"rrow",hd?" hd":"","\"><div class=\"rl",hd?" act":"","\">R",(i+1),"</div>"];
    if(isAdmin){
      row.push(mSel(c,i,"a1",r.a1,[r.a2,r.b1,r.b2],pres));
      row.push(mSel(c,i,"a2",r.a2,[r.a1,r.b1,r.b2],pres));
      row.push(nSel(c,i,"sa",r.sa,mm));
      row.push(nSel(c,i,"sb",r.sb,mm));
      row.push(mSel(c,i,"b1",r.b1,[r.a1,r.a2,r.b2],pres));
      row.push(mSel(c,i,"b2",r.b2,[r.a1,r.a2,r.b1],pres));
    } else {
      var aWin=!!(res&&res.win.indexOf(r.a1)>-1);
      var bWin=!!(res&&res.win.indexOf(r.b1)>-1);
      [r.a1,r.a2].forEach(function(h2){row.push(pCell(pl,h2,aWin));});
      row.push(["<div style=\"text-align:center;font-weight:800;font-size:13px;color:",(aWin?"#16a34a":(bWin?"#9ca3af":"#111")),";\">",(r.sa!==""?e(r.sa):"&#8212;"),"</div>"].join(""));
      row.push(["<div style=\"text-align:center;font-weight:800;font-size:13px;color:",(bWin?"#16a34a":(aWin?"#9ca3af":"#111")),";\">",(r.sb!==""?e(r.sb):"&#8212;"),"</div>"].join(""));
      [r.b1,r.b2].forEach(function(h2){row.push(pCell(pl,h2,bWin));});
    }
    row.push("</div>");
    rows.push(row.join(""));
  }
  var emptyMsg=(!isAdmin&&rows.length===0)?"<div class=\"empty\">Belum ada result Court "+CN[c]+"</div>":"";
  var h=[];
  h.push("<div class=\"ccard\"><div class=\"chdr "+CG[c]+"\">");
  h.push("<div class=\"chl\"><div class=\"cnum\">"+CN[c]+"</div><div class=\"cnm\">COURT "+CN[c]+"</div><div class=\"sbg\">W="+W+" L="+L+"</div></div>");
  h.push("<div class=\"rbg\">"+f+"/"+MR+" rounds</div></div>");
  h.push("<div class=\"rch\"><div></div><div style=\"grid-column:span 2;color:#16a34a\">PASUKAN A</div><div style=\"grid-column:span 2;color:#6b7280\">SKOR</div><div style=\"grid-column:span 2;color:#2563eb\">PASUKAN B</div></div>");
  h.push("<div class=\"rbdy\">"+rows.join("")+emptyMsg+"</div></div>");
  return h.join("");
}
function pCell(pl,h2,won){
  var pp=h2?pl.filter(function(x){return x.handle===h2;})[0]:null;
  if(!pp)return "<div style=\"text-align:center;color:#d1d5db;font-size:11px;\">&#8212;</div>";
  return ["<div style=\"display:flex;align-items:center;justify-content:center;gap:4px;padding:3px;\">",
    avImg(pp.avatarId,pp.name,"sm"),
    "<span style=\"font-size:10px;font-weight:600;color:",(won?"#16a34a":"#1e40af"),";\">",e(pp.name),"</span></div>"].join("");
}

function mSel(court,ri,field,val,excl,pl){
  var opts=pl.filter(function(p){return excl.indexOf(p.handle)<0||p.handle===val;}).map(function(p){
    return ["<option value=\"",e(p.handle),"\"",p.handle===val?" selected":"",">",e(p.name),"</option>"].join("");
  }).join("");
  return ["<select class=\"",val?"fl":"","\" onchange=\"sF(",court,",",ri,",'",field,"',this.value)\"><option value=\"\">&#8212;</option>",opts,"</select>"].join("");
}
function nSel(court,ri,field,val,mm){
  var cls="snum"+(val!==""?" fl":"")+(mm?" mm":"");
  return ["<input type=\"number\" min=\"0\" max=\"50\" class=\"",cls,"\" value=\"",e(val),"\" placeholder=\"-\" onchange=\"sF(",court,",",ri,",'",field,"',this.value)\">"].join("");
}

function bSt(){
  var hbg="linear-gradient(135deg,#111,#2d2d2d)";
  var h=[];
  if(isAdmin){
    h.push("<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;\">");
    h.push("<div style=\"font-size:12px;font-weight:700;color:#6b7280;\">Game Cap:</div>");
    h.push("<div style=\"display:flex;gap:5px;\">");
    [0,7,8,9].forEach(function(n){
      h.push("<button class=\"btn btn-sm\" style=\"background:"+(gameCap===n?"#7f1d1d":"#e5e7eb")+";color:"+(gameCap===n?"#fff":"#374151")+";\" onclick=\"setGameCap("+n+")\">"+(n===0?"All":n)+"</button>");
    });
    h.push("</div></div>");
  }
  h.push("<div class=\"scard\" style=\"margin-top:10px;\">");
  h.push("<div class=\"shdr\" style=\"background:"+hbg+"\">&#127942; Standings</div>");
  h.push("<div class=\"sbdy\">"+bWSt()+"</div></div>");
  return h.join("");
}

function cSt(){
  var rds=S.rds,pl=gpl(),stats={},gl={};
  pl.forEach(function(p){stats[p.handle]={name:p.name,avatarId:p.avatarId||"",w:0,l:0,g:0,pts:0,winPts:0,losePts:0};});
  CO.forEach(function(c){
    rds[c].forEach(function(r,idx){
      var res=rowResult(r);
      if(!res)return;
      res.win.forEach(function(h2){if(!gl[h2])gl[h2]=[];gl[h2].push({c:c,rn:idx+1,res:"W"});});
      res.lose.forEach(function(h2){if(!gl[h2])gl[h2]=[];gl[h2].push({c:c,rn:idx+1,res:"L"});});
    });
  });
  Object.keys(gl).forEach(function(h){gl[h].sort(function(a,b){return a.rn-b.rn;});});
  Object.keys(gl).forEach(function(h){
    if(!stats[h])stats[h]={name:h,avatarId:"",w:0,l:0,g:0,pts:0,winPts:0,losePts:0};
    var allGames=gl[h];
    var cap=gameCap||0;var cappedGames=cap>0?allGames.slice(0,cap):allGames;
    stats[h].g=allGames.length; // actual games played
    cappedGames.forEach(function(g){var b=CB[g.c];if(g.res==="W"){stats[h].w++;stats[h].winPts+=WP+b;stats[h].pts+=WP+b;}else{stats[h].l++;stats[h].losePts+=b;stats[h].pts+=b;}});
  });
  return stats;
}
function bWSt(){
  var s=cSt();
  var rows=Object.entries(s).filter(function(x){return x[1].g>0;}).sort(function(a,b){return b[1].pts-a[1].pts;});
  return rows.length?bSTbl(rows):"<div class=\"empty\">Belum ada result lagi</div>";
}
function bSTbl(rows){
  var leg=CO.map(function(c){return "<div class=\"schip\">Court "+CN[c]+": W="+(WP+CB[c])+" L="+CB[c]+"</div>";}).join("");
  var md=["&#127945;","&#127946;","&#127947;"];
  var trs=rows.map(function(x,i){
    return ["<tr><td>",(md[i]||i+1),"</td>",
      "<td><div style=\"display:flex;align-items:center;gap:8px;\">",avImg(x[1].avatarId,x[1].name,"sm"),"<span style=\"font-weight:600;\">",e(x[1].name),"</span></div></td>",
      "<td class=\"c\"><span class=\"pb\">",x[1].pts,"</span></td>",
      "<td class=\"c wn\">",x[1].winPts,"</td><td class=\"c ln\">",x[1].losePts,"</td>",
      "<td class=\"c wn\">",x[1].w,"</td><td class=\"c ln\">",x[1].l,"</td><td class=\"c gn\">",x[1].g,"</td></tr>"].join("");
  }).join("");
  return "<div class=\"sleg\">"+leg+"</div><div class=\"xtw\"><table><thead><tr><th>#</th><th>Player</th><th class=\"c\">Pts</th><th class=\"c\">Win Pts</th><th class=\"c\">Lose Pts</th><th class=\"c\">W</th><th class=\"c\">L</th><th class=\"c\">Games</th></tr></thead><tbody>"+trs+"</tbody></table></div>";
}

function bPl(){
  var pl=gpl();
  var rows=pl.map(function(p,i){
    return ["<tr><td>",avImg(p.avatarId,p.name,"sm"),"</td>",
      "<td style=\"font-weight:600;\">",e(p.name),"</td>",
      "<td style=\"color:#6b7280;font-size:11px;\">",e(p.handle),"</td>",
      "<td style=\"display:flex;gap:4px;\"><button class=\"btn btn-sm\" style=\"background:#3b82f6;color:#fff;\" onclick=\"editPl(",i,")\">&#9998;</button><button class=\"btn btn-r btn-sm\" onclick=\"rmPl(",i,")\">&#10005;</button></td></tr>"].join("");
  }).join("");
  var h=[];
  h.push("<div class=\"aform\"><div style=\"font-size:13px;font-weight:700;margin-bottom:13px;\">&#10133; Add Player</div>");
  h.push("<div class=\"fgrid\"><div class=\"fg\"><label class=\"fl2\">Name</label><input type=\"text\" id=\"in\" placeholder=\"e.g. Aiman Basri\"></div>");
  h.push("<div class=\"fg\"><label class=\"fl2\">Reclub Handle</label><input type=\"text\" id=\"ih\" placeholder=\"e.g. @aiman-basri\"></div></div>");
  h.push("<div class=\"fg\" style=\"margin-bottom:10px;\"><label class=\"fl2\">Avatar ID</label><input type=\"text\" id=\"ia\" placeholder=\"e.g. 1012170\" oninput=\"pvAv(this.value)\"></div>");
  h.push("<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px;\">");
  h.push("<img id=\"avp\" style=\"width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e5e7eb;\" src=\"\"><span style=\"font-size:11px;color:#9ca3af;\">Avatar preview</span></div>");
  h.push("<button class=\"btn\" style=\"background:"+acc()+";color:#fff;\" onclick=\"addPl()\">Add Player</button></div>");
  h.push("<div style=\"font-size:12px;font-weight:700;color:#6b7280;margin-bottom:8px;\">"+pl.length+" players</div>");
  h.push("<div class=\"xtw\" style=\"background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;\">");
  h.push("<table><thead><tr><th></th><th>Name</th><th>Handle</th><th></th></tr></thead><tbody>"+rows+"</tbody></table></div>");
  h.push("<div class=\"aform\" style=\"margin-top:16px;border-color:#fecaca;\">");
  h.push("<div style=\"font-size:13px;font-weight:700;margin-bottom:6px;color:#7f1d1d;\">&#9888; Reset Scores</div>");
  h.push("<div style=\"font-size:12px;color:#6b7280;margin-bottom:12px;\">Padam semua match result &amp; attendance. Player list ("+pl.length+" players) akan kekal.</div>");
  h.push("<button class=\"btn btn-r\" onclick=\"resetScores()\">&#128465; Reset Scores</button>");
  h.push("</div>");
  return h.join("");
}

// Actions
function sTab(x){tab=x;render();}
function sAC(x){ac=x;rp("score");}
function tAt(h){if(!isAdmin)return;var a=gat();var i=a.indexOf(h);if(i>-1)a.splice(i,1);else a.push(h);save();rp("attend");}
function selAll(){if(!isAdmin)return;S.at=gpl().map(function(p){return p.handle;});save();rp("attend");}
function clrAt(){if(!isAdmin)return;S.at=[];save();rp("attend");}
function sF(c,ri,f,v){if(!isAdmin)return;grd()[c][ri][f]=v;save();rp("score");}
function addPl(){
  if(!isAdmin)return;
  var nm=(document.getElementById("in")||{}).value||"";nm=nm.trim();
  var hd=(document.getElementById("ih")||{}).value||"";hd=hd.trim();
  var aid=(document.getElementById("ia")||{}).value||"";aid=aid.trim();
  if(!nm||!hd){alert("Name dan handle wajib!");return;}
  var pl=gpl();
  if(pl.filter(function(p){return p.handle===hd;}).length){alert("Handle dah ada!");return;}
  pl.push({name:nm,handle:hd,avatarId:aid});
  pl.sort(function(a,b){return a.name.localeCompare(b.name);});
  save();rp("players");
}
function rmPl(i){if(!isAdmin)return;if(!confirm("Remove player?"))return;gpl().splice(i,1);save();rp("players");}
function resetScores(){
  if(!isAdmin)return;
  if(!confirm("Reset semua scoresheet & attendance? Player list akan kekal. Tindakan ini tak boleh undo."))return;
  S.rds=mkR();S.at=[];gameCap=0;
  save();render();
}
function pvAv(id){var img=document.getElementById("avp");if(img&&id)img.src=av(id);}
function openLogin(){showLoginModal=true;render();setTimeout(function(){var el=document.getElementById("mpw");if(el)el.focus();},100);}
function closeLogin(evt){if(evt&&evt.target!==evt.currentTarget)return;showLoginModal=false;render();}
function doLogin(){
  var pw=document.getElementById("mpw");
  if(pw&&pw.value===ADMIN_PASS){isAdmin=true;showLoginModal=false;tab="attend";render();}
  else{var err=document.getElementById("merr");if(err)err.style.display="block";if(pw)pw.value="";}
}
function doLogout(){isAdmin=false;tab="standings";render();}
function expCSV(){
  if(!isAdmin)return;
  var csv="Court,Round,TeamA1,TeamA2,ScoreA,ScoreB,TeamB1,TeamB2,Winner\n";
  var noOf=function(h){var p=gpl().filter(function(x){return x.handle===h;})[0];return p?p.name:h;};
  CO.forEach(function(c){
    S.rds[c].forEach(function(r,i){
      var res=rowResult(r);
      if(!res)return;
      var winner=res.win.indexOf(r.a1)>-1?"A":"B";
      csv+=CN[c]+","+(i+1)+","+noOf(r.a1)+","+noOf(r.a2)+","+r.sa+","+r.sb+","+noOf(r.b1)+","+noOf(r.b2)+","+winner+"\n";
    });
  });
  navigator.clipboard.writeText(csv).then(function(){var b=document.getElementById("bex");if(b){b.textContent="Copied!";setTimeout(function(){b.textContent="&#128203; Export";},2000);}});
}


function editPl(i){
  var pl=gpl(),p=pl[i];
  if(!p)return;
  var html2="<div class=\"modal-overlay\" onclick=\"closeEditPl(event)\">"
    +"<div class=\"modal\">"
    +"<div class=\"modal-title\">&#9998; Edit Player</div>"
    +"<div style=\"margin-bottom:10px;\">"
    +"<label class=\"fl2\">Name</label>"
    +"<input type=\"text\" id=\"ep-nm\" value=\""+e(p.name)+"\" style=\"margin-top:4px;\">"
    +"</div>"
    +"<div style=\"margin-bottom:10px;\">"
    +"<label class=\"fl2\">Reclub Handle</label>"
    +"<input type=\"text\" id=\"ep-hd\" value=\""+e(p.handle)+"\" style=\"margin-top:4px;\">"
    +"</div>"
    +"<div style=\"margin-bottom:14px;\">"
    +"<label class=\"fl2\">Avatar ID</label>"
    +"<input type=\"text\" id=\"ep-av\" value=\""+e(p.avatarId||"")+"\" style=\"margin-top:4px;\" oninput=\"prevEditAv(this.value)\">"
    +"<div style=\"display:flex;align-items:center;gap:10px;margin-top:8px;\">"
    +"<img id=\"ep-avp\" src=\""+(p.avatarId?av(p.avatarId):"")+"\" style=\"width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e5e7eb;\">"
    +"<span style=\"font-size:11px;color:#9ca3af;\">Preview</span>"
    +"</div></div>"
    +"<div class=\"modal-btns\">"
    +"<button class=\"btn\" style=\"background:#7f1d1d;color:#fff;flex:1;\" onclick=\"saveEditPl("+i+")\">Save</button>"
    +"<button class=\"btn btn-g\" onclick=\"closeEditPl()\">Cancel</button>"
    +"</div></div></div>";
  var overlay=document.createElement("div");
  overlay.id="edit-pl-modal";
  overlay.innerHTML=html2;
  document.body.appendChild(overlay);
}
function prevEditAv(id){var img=document.getElementById("ep-avp");if(img&&id)img.src=av(id);}
function closeEditPl(evt){
  if(evt&&evt.target.id!=="edit-pl-modal")return;
  var el=document.getElementById("edit-pl-modal");if(el)el.remove();
}
function saveEditPl(i){
  var pl=gpl(),p=pl[i];
  var nm=(document.getElementById("ep-nm")||{}).value||"";nm=nm.trim();
  var hd=(document.getElementById("ep-hd")||{}).value||"";hd=hd.trim();
  var aid=(document.getElementById("ep-av")||{}).value||"";aid=aid.trim();
  if(!nm||!hd){alert("Name dan handle wajib!");return;}
  p.name=nm;p.handle=hd;p.avatarId=aid;
  pl.sort(function(a,b){return a.name.localeCompare(b.name);});
  var el=document.getElementById("edit-pl-modal");if(el)el.remove();
  save();rp("players");
}
function setGameCap(n){gameCap=n;save();render();}
function showDebug(){
  alert("LOAD DEBUG:\n"+JSON.stringify(window.lastLoadDebug,null,2));
}
window.setGameCap=setGameCap;
window.showDebug=showDebug;
window.sTab=sTab;window.sAC=sAC;
window.tAt=tAt;window.selAll=selAll;window.clrAt=clrAt;window.sF=sF;
window.addPl=addPl;window.rmPl=rmPl;window.pvAv=pvAv;window.expCSV=expCSV;window.expJSON=expJSON;window.resetScores=resetScores;
window.editPl=editPl;window.prevEditAv=prevEditAv;window.closeEditPl=closeEditPl;window.saveEditPl=saveEditPl;
window.openLogin=openLogin;window.closeLogin=closeLogin;window.doLogin=doLogin;window.doLogout=doLogout;


function expJSON(){
  if(!isAdmin)return;
  var data={
    pl:gpl(),
    at:S.at,
    rds:S.rds,
    gameCap:gameCap,
    exportedAt:new Date().toISOString()
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="paddle-slayer-export-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

load();</script>
