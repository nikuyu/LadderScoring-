<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ladder Admin</title>
<link rel="icon" type="image/png" href="/images/logo.png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="container">
  <div class="brand">
    <img src="/images/logo.png" alt="Paddle Slayer" class="logo" />
    <h1>Ladder Admin</h1>
  </div>

  <div class="card" id="loginCard">
    <h2>Login</h2>
    <input type="password" id="passwordInput" placeholder="Admin password" />
    <button onclick="login()">Log in</button>
    <p class="error" id="loginError"></p>
  </div>

  <div id="adminArea" style="display:none;">
    <div class="card">
      <button class="secondary" onclick="logout()">Log out</button>
      <button class="danger" onclick="resetLadder()">Reset ladder (keep players)</button>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div id="playersList"></div>
      <input type="text" id="newPlayerName" placeholder="Player name" />
      <button onclick="addPlayer()">Add player</button>
      <p class="error" id="playerError"></p>
    </div>

    <div class="card" id="setupCard">
      <h2>Set Up Round 1</h2>
      <p class="muted">Tap a player below, then tap a slot to place them. Tap a filled slot to send that player back to the pool. This only happens once — every round after this is generated automatically.</p>
      <div id="setupPool"></div>
      <div id="setupCourts"></div>
      <button onclick="submitSetup()">Create Round 1</button>
      <p class="error" id="setupError"></p>
    </div>

    <div class="card" id="scoreCard" style="display:none;">
      <h2>Enter Scores — <span id="currentRoundLabel"></span></h2>
      <div id="scoreCourts"></div>
      <p class="error" id="scoreError"></p>
      <p class="success" id="scoreSuccess"></p>
    </div>
  </div>
</div>

<script>
let players = [];
let rounds = [];

async function checkAuth() {
  const r = await fetch('/api/admin/check').then(r => r.json());
  if (r.loggedIn) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminArea').style.display = 'block';
    await refreshAll();
  }
}

async function login() {
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (res.ok) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminArea').style.display = 'block';
    await refreshAll();
  } else {
    let message = 'Wrong password.';
    try {
      const err = await res.json();
      if (err && err.error) message = err.error;
    } catch (e) {}
    document.getElementById('loginError').textContent = message;
  }
}

async function logout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
}

async function resetLadder() {
  if (!confirm('This deletes all rounds and scores (players stay). Continue?')) return;
  await fetch('/api/rounds/reset', { method: 'POST' });
  await refreshAll();
}

async function refreshAll() {
  players = await fetch('/api/players').then(r => r.json());
  rounds = await fetch('/api/rounds').then(r => r.json());
  renderPlayers();
  if (rounds.length === 0) {
    document.getElementById('setupCard').style.display = 'block';
    document.getElementById('scoreCard').style.display = 'none';
    renderSetupForm();
  } else {
    document.getElementById('setupCard').style.display = 'none';
    document.getElementById('scoreCard').style.display = 'block';
    renderScoreForm();
  }
}

function renderPlayers() {
  const div = document.getElementById('playersList');
  if (players.length === 0) {
    div.innerHTML = '<p class="muted">No players yet. Add at least 16 to fill all 4 courts.</p>';
    return;
  }
  div.innerHTML = '<ul>' + players.map(p => `<li>${p.name} <button class="secondary" style="padding:2px 8px;font-size:0.8em;" onclick="removePlayer('${p._id}')">remove</button></li>`).join('') + '</ul>';
}

async function addPlayer() {
  const name = document.getElementById('newPlayerName').value.trim();
  if (!name) return;
  const res = await fetch('/api/players', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (res.ok) {
    document.getElementById('newPlayerName').value = '';
    document.getElementById('playerError').textContent = '';
    await refreshAll();
  } else {
    const err = await res.json();
    document.getElementById('playerError').textContent = err.error;
  }
}

async function removePlayer(id) {
  if (!confirm('Remove this player?')) return;
  await fetch('/api/players/' + id, { method: 'DELETE' });
  await refreshAll();
}

let setupAssignments = {}; // slot key e.g. "3_A0" -> playerId
let setupSelectedPlayer = null;

function setupSlotKey(court, team, idx) {
  return `${court}_${team}${idx}`;
}

function renderSetupForm() {
  const validIds = new Set(players.map(p => p._id));
  for (const key of Object.keys(setupAssignments)) {
    if (!validIds.has(setupAssignments[key])) delete setupAssignments[key];
  }
  if (setupSelectedPlayer && !validIds.has(setupSelectedPlayer)) setupSelectedPlayer = null;

  const assignedIds = new Set(Object.values(setupAssignments));
  const available = players.filter(p => !assignedIds.has(p._id));

  const pool = document.getElementById('setupPool');
  pool.innerHTML = '<p class="muted" style="margin:4px 0;">Available players:</p><div class="chip-row">' +
    available.map(p => `<span class="chip ${setupSelectedPlayer === p._id ? 'chip-selected' : ''}" onclick="pickSetupPlayer('${p._id}')">${p.name}</span>`).join('') +
    (available.length === 0 ? '<span class="muted">All assigned</span>' : '') +
    '</div>';

  const slot = (court, team, idx) => {
    const key = setupSlotKey(court, team, idx);
    const pid = setupAssignments[key];
    const label = pid ? nameFor(pid) : `Team ${team}`;
    return `<span class="slot ${pid ? 'slot-filled' : 'slot-empty'}" onclick="tapSetupSlot('${key}')">${label}</span>`;
  };

  const div = document.getElementById('setupCourts');
  let html = '';
  for (const court of [1, 2, 3, 4]) {
    html += `<div class="match-row setup-row">
      <span class="court-badge court-${court}">Court ${court}</span>
      <div class="team-slots">${slot(court, 'A', 0)}${slot(court, 'A', 1)}</div>
      <span class="vs-label">vs</span>
      <div class="team-slots">${slot(court, 'B', 0)}${slot(court, 'B', 1)}</div>
    </div>`;
  }
  div.innerHTML = html;
}

function pickSetupPlayer(id) {
  setupSelectedPlayer = setupSelectedPlayer === id ? null : id;
  renderSetupForm();
}

function tapSetupSlot(key) {
  if (setupAssignments[key]) {
    delete setupAssignments[key];
    renderSetupForm();
    return;
  }
  if (setupSelectedPlayer) {
    setupAssignments[key] = setupSelectedPlayer;
    setupSelectedPlayer = null;
    renderSetupForm();
  }
}

async function submitSetup() {
  const matches = [];
  for (const court of [1, 2, 3, 4]) {
    const a1 = setupAssignments[setupSlotKey(court, 'A', 0)];
    const a2 = setupAssignments[setupSlotKey(court, 'A', 1)];
    const b1 = setupAssignments[setupSlotKey(court, 'B', 0)];
    const b2 = setupAssignments[setupSlotKey(court, 'B', 1)];
    if (!a1 || !a2 || !b1 || !b2) {
      document.getElementById('setupError').textContent = `Court ${court} is missing a player.`;
      return;
    }
    matches.push({ court, teamA: [a1, a2], teamB: [b1, b2] });
  }
  const res = await fetch('/api/rounds/setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ matches }),
  });
  if (res.ok) {
    setupAssignments = {};
    setupSelectedPlayer = null;
    document.getElementById('setupError').textContent = '';
    await refreshAll();
  } else {
    const err = await res.json();
    document.getElementById('setupError').textContent = err.error;
  }
}

function nameFor(id) {
  const p = players.find(p => p._id === id);
  return p ? p.name : '?';
}

function renderScoreForm() {
  const latest = rounds[rounds.length - 1];
  document.getElementById('currentRoundLabel').textContent = `Round ${latest.roundNumber}`;
  const div = document.getElementById('scoreCourts');
  let html = '';
  for (const court of [1,2,3,4]) {
    const m = latest.matches.find(x => x.court === court);
    const played = m.winner === 'A' || m.winner === 'B';
    const teamAName = m.teamA.map(nameFor).join(' & ');
    const teamBName = m.teamB.map(nameFor).join(' & ');
    const aWin = m.winner === 'A';
    const bWin = m.winner === 'B';

    const teamBlock = (name, isWin, scoreInputId, currentScore) => `
      <div class="team-block${isWin ? ' team-win' : ''}">
        <div class="team-names">${name}${isWin ? ' <span class="winner-tag">WIN</span>' : ''}</div>
        ${played
          ? `<div class="score-display">${currentScore}</div>`
          : `<input type="number" class="score-input" id="${scoreInputId}" placeholder="0" />`}
      </div>`;

    html += `<div class="court-card">
      <div class="court-header court-${court}">
        <span class="court-num">${court}</span>
        <span class="court-title">COURT ${court}</span>
        <span class="court-status">${played ? 'Played' : 'Pending'}</span>
      </div>
      <div class="score-row">
        ${teamBlock(teamAName, aWin, `score_${court}_a`, m.teamAScore)}
        <span class="vs-label">VS</span>
        ${teamBlock(teamBName, bWin, `score_${court}_b`, m.teamBScore)}
      </div>
      ${played ? '' : `<button class="save-btn" onclick="submitScore(${court})">Save Score</button>`}
    </div>`;
  }
  div.innerHTML = html;
}

async function submitScore(court) {
  const teamAScore = document.getElementById(`score_${court}_a`).value;
  const teamBScore = document.getElementById(`score_${court}_b`).value;
  const res = await fetch('/api/rounds/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ court, teamAScore, teamBScore }),
  });
  const data = await res.json();
  if (res.ok) {
    document.getElementById('scoreError').textContent = '';
    document.getElementById('scoreSuccess').textContent = data.nextRoundCreated ? 'Round complete! Next round generated.' : 'Score saved.';
    await refreshAll();
  } else {
    document.getElementById('scoreError').textContent = data.error;
    document.getElementById('scoreSuccess').textContent = '';
  }
}

checkAuth();
</script>
</body>
</html>
